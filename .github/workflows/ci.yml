name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  ci:
    permissions:
      contents: write
    uses: koomx/x-ci/.github/workflows/vcpkg-template.yml@main
    with:
      enable-std20-ubuntu24-amd64: true
      enable-std20-ubuntu24-arm64: true
      enable-macos-arm64: true
      enable-windows: true
      # Windows: scripts/ci_configure.py forces MSVC (cl) via vcvarsall and
      # refuses MinGW. Non-Windows: same as cmake --preset=ci.
      config-command: |
        python3 scripts/ci_configure.py
      build-command: |
        cmake --build build-ninja --parallel
      test-command: |
        if [ "$(uname -s 2>/dev/null)" = Linux ] && { [ "$(uname -m)" = aarch64 ] || [ "$(uname -m)" = arm64 ]; }; then
          echo "skip ctest on linux arm"
          exit 0
        fi
        ctest --test-dir build-ninja --output-on-failure -j1
