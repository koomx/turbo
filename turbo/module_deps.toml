# turbo module dependency rules (strict allow-list).
#
# A file under turbo/<module>/ may only #include <turbo/<other>/...> when
# <other> is listed in that module's allow list (or is the same module).
# .h / .hh / .hpp / .inc / .c / .cc / .cpp are all checked.
#
# Refresh edges:
#   python3 scripts/check_module_deps.py list-all
# Enforce:
#   python3 scripts/check_module_deps.py check

[policy]
default_unlisted = "unchecked"

# module = comma-separated allowed dependency modules (may be empty).
[allow]

################################################################################
################################################################################
#
#  CLEARED — allow lists match list-all; no cycles.
#
################################################################################
################################################################################

#######################################
# L0 — portable macros only
#######################################
macros = ""

#######################################
# L1 — foundation
#######################################
base = "macros"
meta = "macros"
utility = "macros"
cctz = "macros"

#######################################
# L2 — low-level helpers
#######################################
bits = "base, macros, meta"
algorithm = "base, macros, meta"
cleanup = "base, macros"
memory = "hash, macros, meta, utility"
functional = "base, macros, meta, utility"

#######################################
# L3 — numeric / debug / hash
#######################################
numeric = "algorithm, bits, macros"
debugging = "base, bits, macros"
hash = "bits, functional, macros, meta, numeric, utility"

#######################################
# L4 — vocabulary types
#######################################
types = "algorithm, base, hash, macros, memory, meta, utility"

#######################################
# L5 — formatting / to-string
#######################################
format = "base, bits, functional, macros, meta, numeric, types, utility"

#######################################
# L6 — CRC
#######################################
crc = "base, bits, format, macros, memory"

#######################################
# L7 — strings
#######################################
strings = "base, bits, format, macros, meta, numeric, types"

#######################################
# L8 — time / status / cord
#######################################
time = "base, bits, cctz, macros, numeric, strings"
status = "base, debugging, format, functional, hash, macros, meta, strings, time, types, utility"
# uses memory/container_memory (shared helpers for cord / collections)
cord = "algorithm, base, bits, crc, functional, hash, macros, memory, meta, strings, types"

#######################################
# L9 — flags / log
#######################################
flags = "algorithm, base, bits, format, macros, memory, meta, numeric, strings, utility"
log = "base, bits, cleanup, debugging, format, functional, hash, macros, meta, strings, time, types, utility"

# Modules temporarily skipped by `check` (still visible to `list`).
[unchecked]
# (none)
